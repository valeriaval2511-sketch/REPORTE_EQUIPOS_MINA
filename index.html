<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubicación de Equipos - Mina </title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#198754">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header class="topbar">
  <h1>Equipos Mina</h1>
  <div id="estadoConexion" class="estado online">Conectando...</div>
</header>

<!-- REGISTRO -->
<section class="card">
<h3>Registro</h3>

<div class="fila2">
<div>
<label>Tipo</label>
<select id="tipo">
<option value="Entrada">Entrada</option>
<option value="Salida">Salida</option>
</select>
</div>

<div>
<label>Guardia</label>
<select id="guardia">
<option>A</option>
<option>B</option>
<option>C</option>
</select>
</div>
</div>

<label>DNI</label>
<input id="dni" list="listaDNI">
<datalist id="listaDNI"></datalist>

<div id="nombre" class="nombreVista"></div>

<label>Equipo</label>
<input id="equipo" list="listaEquipos">
<datalist id="listaEquipos"></datalist>

<label>Labor</label>
<input id="labor" list="listaLabores">
<datalist id="listaLabores"></datalist>

<label>Estado</label>
<select id="estado">
<option>Operativo</option>
<option>Inoperativo</option>
<option>Mtto Preventivo</option>
<option>Mtto Correctivo</option>
<option>Stand By</option>
</select>

</section>

<!-- EVIDENCIA -->
<section class="card">
<h3>Evidencia</h3>

<label>Observación</label>
<textarea id="obs"></textarea>

<label>Foto</label>

<input
type="file"
id="foto"
accept="image/*"
style="display:none;">

<button
type="button"
class="btn gris"
onclick="document.getElementById('foto').click()">
Tomar Foto
</button>

<div id="nombreFoto"></div>

</section>

<!-- ACCIONES -->
<section class="card">
<h3>Acciones</h3>

<button id="btnGuardar" class="btn azul">
Guardar Registro
</button>

<button id="btnSync" class="btn verde">
Sincronizar
</button>

<div id="mensaje"></div>

<div class="pendientes">
Pendientes: <span id="numPendientes">0</span>
</div>

<button class="btn gris" id="btnTabla">
Mostrar Tabla
</button>

</section>

<!-- HISTORIAL -->
<section class="card" id="seccionTabla" style="display:none;">
<h3>Últimos registros</h3>

<div class="fila2">
<div>
<label>Fecha</label>
<input type="date" id="filtroFecha">
</div>

<div>
<label>Guardia</label>
<select id="filtroGuardia">
<option value="">Todas</option>
<option>A</option>
<option>B</option>
<option>C</option>
</select>
</div>
</div>

<label>Equipo</label>
<input id="filtroEquipo" list="listaEquipos">

<label>Estado</label>
<select id="filtroEstado">
<option value="">Todos</option>
<option>Operativo</option>
<option>Inoperativo</option>
<option>Mtto Preventivo</option>
<option>Mtto Correctivo</option>
<option>Stand By</option>
</select>

<button class="btn verde" id="btnFiltrar">
Filtrar
</button>

<div id="tabla"></div>

</section>

</div>

<div id="modalObs" class="modal">
  <div class="modal-box">
    <h3>Observación</h3>

    <div id="textoObs"></div>

    <button class="btn verde" onclick="cerrarModal()">
      Cerrar
    </button>
  </div>
</div>

<script src="db.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("SW registrado"))
    .catch(err => console.log(err));
}
</script>

</body>
</html>
